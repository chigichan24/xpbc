name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: "/Applications/Xcode_16.2.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: make test
      - name: Release build (universal)
        run: make build-universal
